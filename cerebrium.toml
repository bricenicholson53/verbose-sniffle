[cerebrium.deployment]
name = "conto"
python_version = "3.11"
docker_base_image_url = "debian:bookworm-slim"
disable_auth = true
include = ['./*', 'main.py', 'cerebrium.toml']
exclude = ['.*']

[cerebrium.hardware]
compute = "ADA_L40"
gpu_count = 1
provider = "crusoe"
region = "us-east-1"

[cerebrium.scaling]
min_replicas = 3
max_replicas = 3
cooldown = 10
replica_concurrency = 1000

[cerebrium.dependencies.pip]
numpy = "latest"

[cerebrium.dependencies.apt]
curl = "latest"
wget = "latest"
ocl-icd-opencl-dev = "latest"
sudo = "latest"
git = "latest"
